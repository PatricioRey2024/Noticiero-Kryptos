name: NotiKryptos - Alertas

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Horas hacia atrás para la prueba manual (48 normal, 168 una semana)"
        required: false
        default: "48"
        type: string
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: notikryptos-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar alertas
        env:
          RUN_MODE: alerts
          MAX_NEWS_AGE_HOURS: ${{ inputs.lookback_hours || '48' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python bot.py

      # Las pruebas manuales desde una rama no deben escribir state.json en main.
      - name: Guardar estado
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualizar estado de alertas"
          git pull --rebase origin main
          git push origin HEAD:main
